
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Login - GiveAID Admin</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700&display=fallback">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
    <style>
        .login-logo a { color: #28a745; font-weight: 700; }
        .login-card-body .input-group .input-group-text { color: #6c757d; }
    </style>
</head>
<body class="hold-transition login-page" style="background: linear-gradient(135deg, #28a745 0%, #198754 100%); min-height: 100vh;">
    <div class="login-box">
        <div class="login-logo">
            <a href="/"><b>Give</b>AID</a>
        </div>

        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Sign in to GiveAID Admin</p>


                <form method="post" id="loginForm" action="/Admin/Auth/Login">
                    <div class="input-group mb-3">
                        <input type="email" name="Email" class="form-control" placeholder="Email" required autofocus>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-envelope"></span>
                            </div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" name="Password" class="form-control" placeholder="Password" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-8">
                            <div class="icheck-primary">
                                <input type="checkbox" name="RememberMe" id="remember" value="true">
                                <label for="remember">Remember Me</label>
                            </div>
                        </div>
                        <div class="col-4">
                            <button type="submit" class="btn btn-success btn-block" id="btnLogin">
                                <span id="btnText">Sign In</span>
                                <span id="btnSpinner" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
                            </button>
                        </div>
                    </div>
                <input name="__RequestVerificationToken" type="hidden" value="CfDJ8Gbk6wpJdXJNsmkFWRlumS8o47v_VDyFpm4deoeQUy4wkMfyQodZwpXTAgdGhSDDGJ_injHgC-NJThjXCG1Qms_hDs0al1xZVJCvh3zhkknaSqaWWC6NoTAfPF0iYnUWKFN30MXvx1aNJGqWW7f4hTM" /></form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(function() {
            $('#loginForm').on('submit', function() {
                $('#btnLogin').prop('disabled', true);
                $('#btnText').hide();
                $('#btnSpinner').show();
            });
        });
    </script>
</body>
</html>
